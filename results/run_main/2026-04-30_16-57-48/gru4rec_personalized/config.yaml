data:
  data_path: data/ml-1m
  min_rating: 4.0
  min_interactions: 5
model:
  embed_dim: 128
  hidden_dim: 256
  num_layers: 1
  dropout: 0.4
  max_seq_len: 50
training:
  batch_size: 512
  lr: 0.0005
  weight_decay: 1.0e-05
  epochs: 50
  patience: 10
  eval_k: 10
  device: cuda
  num_workers: 4
  pin_memory: true
  use_amp: true
debiasing:
  loss_type: personalized
  trend_window_days: 30
  max_weight: 5.0
  use_alpha: true
  use_beta: true
