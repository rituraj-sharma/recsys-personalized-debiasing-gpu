data:
  data_path: data/ml-1m
  min_rating: 4.0
  min_interactions: 5
model:
  embed_dim: 64
  hidden_dim: 128
  num_layers: 1
  dropout: 0.2
  max_seq_len: 50
training:
  batch_size: 512
  lr: 0.001
  weight_decay: 1.0e-05
  epochs: 20
  patience: 10
  eval_k: 10
  device: cuda
  num_workers: 4
  pin_memory: true
  use_amp: true
debiasing:
  loss_type: ce
  trend_window_days: 30
  max_weight: 20.0
  use_alpha: true
  use_beta: true
